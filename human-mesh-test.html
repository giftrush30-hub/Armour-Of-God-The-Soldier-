<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d13">
<title>Armour of God — Character Workshop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13;color:#f3eee4;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
header{position:fixed;z-index:2;top:0;left:0;right:0;padding:14px 16px;background:linear-gradient(#080d13f0,transparent);pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.2em;color:#e0bd70;font-weight:900}.title{font-size:21px;font-weight:900}.status{font-size:12px;line-height:1.5;color:#c7d0d9;margin-top:5px;max-width:520px}#controls{position:fixed;z-index:3;top:150px;left:14px;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 28px)}#controls button{background:#1c2933;color:#f3eee4;border:1px solid #9c7d43;border-radius:10px;padding:10px 12px;font-weight:700;text-align:left}#controls button:disabled{opacity:.55}#controls label{display:block;background:#111a22dd;border:1px solid #394550;border-radius:10px;padding:8px 10px;font-size:12px;color:#e6eaf0}#controls input[type=range]{width:100%;accent-color:#d8b56a;margin-top:6px}
footer{position:fixed;z-index:2;bottom:0;left:0;right:0;text-align:center;padding:18px 12px;background:linear-gradient(transparent,#080d13ee);font-size:12px;color:#c7d0d9}
</style>
</head>
<body>
<div id="view"></div><div id="controls"><button id="poseBtn" disabled>Checking animation support…</button><button id="stanceBtn" disabled>Preparing stance controls…</button><button id="resetBtn" disabled>Reset original pose</button><label>Arm lowering <span id="armValue">40°</span><input id="armRange" type="range" min="10" max="90" value="40" disabled></label><label>Elbow bend <span id="elbowValue">10°</span><input id="elbowRange" type="range" min="0" max="60" value="10" disabled></label></div>
<header><div class="eyebrow">ARMOUR OF GOD: THE SOLDIER</div><div class="title">Character Workshop — Body & Adjustable Stance</div><div id="status" class="status">Combined character test: body, skin tone, rig joints and stance. Experimental changes stay on this page.</div></header>
<footer>Character Workshop · Body and stance tests combined · Main campaign unchanged</footer>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/loaders/GLTFLoader.js";
(function(){
const status=document.getElementById('status'),host=document.getElementById('view'),stanceBtn=document.getElementById('stanceBtn'),resetBtn=document.getElementById('resetBtn'),armRange=document.getElementById('armRange'),elbowRange=document.getElementById('elbowRange'),armValue=document.getElementById('armValue'),elbowValue=document.getElementById('elbowValue');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080d13);
scene.fog=new THREE.Fog(0x080d13,8,22);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(3.6,2.7,6.8);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4efff,0x34271d,1.15));
const key=new THREE.DirectionalLight(0xffd7ad,1.8);key.position.set(3,6,4);scene.add(key);
const fill=new THREE.DirectionalLight(0x9bbdff,0.45);fill.position.set(-4,3,-3);scene.add(fill);
const floor=new THREE.Mesh(new THREE.CircleGeometry(4,64),new THREE.MeshStandardMaterial({color:0x17212a,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;scene.add(floor);
const grid=new THREE.GridHelper(8,16,0x57482d,0x29323b);grid.position.y=-.015;scene.add(grid);
let model=null,mixer=null,activeAction=null,drag=false,lastX=0,lastY=0,rotY=0,rotX=0.0,stanceApplied=false,stanceBones=[]; const clock=new THREE.Clock(); const poseBtn=document.getElementById('poseBtn');
const loader=new GLTFLoader();
const modelURL='https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb';
status.textContent='3D viewer ready. Requesting the human model file…';
loader.load(modelURL,function(gltf){
 model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{m.side=THREE.DoubleSide;if(m.color){m.color.set(0x3f2116);m.needsUpdate=true}if('roughness' in m)m.roughness=0.82;if('metalness' in m)m.metalness=0.0})}}});
 const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 if(!isFinite(size.y)||size.y===0){status.textContent='The file loaded, but its body dimensions could not be read.';return}
 model.position.sub(center);model.position.y+=size.y/2;model.scale.setScalar(2.15/size.y);scene.add(model);
 camera.position.set(2.7,1.9,4.9);camera.lookAt(0,1.03,0);
 let boneCount=0,skinnedCount=0,boneNames=[],boneMap={};
 model.traverse(o=>{if(o.isSkinnedMesh&&o.skeleton){skinnedCount++;boneCount+=o.skeleton.bones.length;o.skeleton.bones.forEach(b=>{boneMap[b.name.toLowerCase()]=b;if(boneNames.length<12&&!boneNames.includes(b.name))boneNames.push(b.name)})}});
 const clips=gltf.animations||[];
 const upperL=boneMap['upperarm_l']||boneMap['upperarm.l']||boneMap['leftupperarm'];
 const upperR=boneMap['upperarm_r']||boneMap['upperarm.r']||boneMap['rightupperarm'];
 const lowerL=boneMap['lowerarm_l']||boneMap['lowerarm.l']||boneMap['leftlowerarm'];
 const lowerR=boneMap['lowerarm_r']||boneMap['lowerarm.r']||boneMap['rightlowerarm'];
 [[upperL,0],[upperR,0],[lowerL,0],[lowerR,0]].forEach(([b])=>{if(b)stanceBones.push({bone:b,original:b.quaternion.clone()})});
 const applyLoweredPose=()=>{const armAngle=Number(armRange.value)*Math.PI/180,elbowAngle=Number(elbowRange.value)*Math.PI/180;stanceBones.forEach(item=>{item.bone.quaternion.copy(item.original);const n=item.bone.name.toLowerCase();const isLeft=n.includes('_l')||n.includes('.l');const sign=isLeft?-1:1;const angle=n.includes('lowerarm')?elbowAngle*sign:armAngle*sign;item.bone.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),angle));});model.updateMatrixWorld(true);armValue.textContent=armRange.value+'°';elbowValue.textContent=elbowRange.value+'°';};
 const resetPose=()=>{stanceBones.forEach(item=>item.bone.quaternion.copy(item.original));model.updateMatrixWorld(true);armRange.value=40;elbowRange.value=10;armValue.textContent='40°';elbowValue.textContent='10°';status.textContent='Original T-pose restored. Adjust the sliders to test a different arm angle.';};
 if(upperL&&upperR){
   stanceBtn.disabled=false;resetBtn.disabled=false;armRange.disabled=false;elbowRange.disabled=false;stanceBtn.textContent='Apply current stance';
   stanceBtn.onclick=()=>{applyLoweredPose();status.textContent='Adjustable stance applied. Use the sliders to tune arm lowering and elbow bend; this remains a pose preview, not a finished combat animation.';};
   armRange.addEventListener('input',()=>{if(stanceApplied){applyLoweredPose()}});
   elbowRange.addEventListener('input',()=>{if(stanceApplied){applyLoweredPose()}});
   stanceBtn.onclick=()=>{stanceApplied=true;applyLoweredPose();status.textContent='Adjustable stance applied. Move either slider to refine the pose.';};
   resetBtn.onclick=()=>{stanceApplied=false;resetPose()};
 }else{stanceBtn.disabled=true;resetBtn.disabled=true;armRange.disabled=true;elbowRange.disabled=true;stanceBtn.textContent='Arm joint names need mapping';}
 const clipNames=clips.length?clips.map(a=>a.name||'(unnamed)').slice(0,5).join(', '):'none bundled';
 if(clips.length){
   mixer=new THREE.AnimationMixer(model);
   poseBtn.disabled=false;poseBtn.textContent='Play: '+(clips[0].name||'built-in animation');
   poseBtn.onclick=()=>{if(activeAction){activeAction.stop();activeAction=null;poseBtn.textContent='Play: '+(clips[0].name||'built-in animation');return}activeAction=mixer.clipAction(clips[0]);activeAction.reset().play();poseBtn.textContent='Stop animation'};
 }else{
   poseBtn.disabled=true;poseBtn.textContent='No built-in animation — manual pose controls';
 }
 status.textContent='Human mesh loaded. Rig: '+boneCount+' joints / '+skinnedCount+' skinned mesh(es). Built-in animations: '+clipNames+'. '+(upperL&&upperR?'A reversible arm-pose experiment is available below.':'Arm joints need mapping before a pose can be tested.')+' Sample joints: '+(boneNames.join(', ')||'no skinned joints detected')+'.';
},function(xhr){status.textContent=xhr.total>0?'Downloading human mesh… '+Math.round(xhr.loaded/xhr.total*100)+'%':'Waiting for the human model file…';},function(err){console.error(err);status.textContent='The character model could not be loaded. This is an isolated test; the main campaign is unchanged.';});
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!model)return;rotY+=(e.clientX-lastX)*.008;rotX+=(e.clientY-lastY)*.004;rotX=Math.max(-.5,Math.min(.5,rotX));lastX=e.clientX;lastY=e.clientY;model.rotation.set(rotX,rotY,0)});
renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
renderer.domElement.addEventListener('wheel',e=>{camera.position.multiplyScalar(e.deltaY>0?1.08:.92);camera.position.clampLength(2.3,10);},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(mixer)mixer.update(dt);renderer.render(scene,camera)}animate();
})();
</script>
</body>
</html>
