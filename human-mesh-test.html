<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d13">
<title>Armour of God — Human Mesh Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13;color:#f3eee4;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
header{position:fixed;z-index:2;top:0;left:0;right:0;padding:14px 16px;background:linear-gradient(#080d13f0,transparent);pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.2em;color:#e0bd70;font-weight:900}.title{font-size:21px;font-weight:900}.status{font-size:12px;line-height:1.5;color:#c7d0d9;margin-top:5px;max-width:520px}
footer{position:fixed;z-index:2;bottom:0;left:0;right:0;text-align:center;padding:18px 12px;background:linear-gradient(transparent,#080d13ee);font-size:12px;color:#c7d0d9}
</style>
</head>
<body>
<div id="view"></div>
<header><div class="eyebrow">ARMOUR OF GOD: THE SOLDIER</div><div class="title">Human Mesh Test — Part 1</div><div id="status" class="status">Preparing the real human model…</div></header>
<footer>Isolated test page · Main campaign and existing character lab are unchanged</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const status=document.getElementById('status'),host=document.getElementById('view');
if(!window.THREE){status.textContent='3D engine failed to load. Please check the internet connection and reload.';return}
if(!THREE.GLTFLoader){status.textContent='The model loader failed to load. The main game is unaffected.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080d13);
scene.fog=new THREE.Fog(0x080d13,8,22);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(3.6,2.7,6.8);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4efff,0x34271d,2.0));
const key=new THREE.DirectionalLight(0xffe2b3,3.0);key.position.set(3,6,4);scene.add(key);
const fill=new THREE.DirectionalLight(0x9bbdff,1.3);fill.position.set(-4,3,-3);scene.add(fill);
const floor=new THREE.Mesh(new THREE.CircleGeometry(4,64),new THREE.MeshStandardMaterial({color:0x17212a,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;scene.add(floor);
const grid=new THREE.GridHelper(8,16,0x57482d,0x29323b);grid.position.y=-.015;scene.add(grid);
let model=null,drag=false,lastX=0,lastY=0,rotY=0,rotX=0.0;
const loader=new THREE.GLTFLoader();
const modelURL='https://www.innerscene.com/api/library/male-base-mesh-3d-person-rigged-a-pose-380e6d89/download';
status.textContent='Loading an actual rigged human body (about 4.3 MB)…';
loader.load(modelURL,function(gltf){
 model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;if(o.material){o.material.side=THREE.DoubleSide}}});
 const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 if(!isFinite(size.y)||size.y===0){status.textContent='The file loaded, but its body dimensions could not be read.';return}
 model.position.sub(center);model.position.y+=size.y/2;model.scale.setScalar(2.15/size.y);scene.add(model);
 camera.position.set(2.7,1.9,4.9);camera.lookAt(0,1.03,0);
 status.textContent='Human mesh loaded. Drag to rotate; pinch or use two fingers to zoom. Checking the body before armour.';
},function(xhr){if(xhr.total>0){status.textContent='Downloading human mesh… '+Math.round(xhr.loaded/xhr.total*100)+'%'}},function(err){console.error(err);status.textContent='Could not load the model from its source. This test page is isolated; the main campaign and character lab remain untouched. We will use another reliable asset route if needed.'});
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!model)return;rotY+=(e.clientX-lastX)*.008;rotX+=(e.clientY-lastY)*.004;rotX=Math.max(-.5,Math.min(.5,rotX));lastX=e.clientX;lastY=e.clientY;model.rotation.set(rotX,rotY,0)});
renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
renderer.domElement.addEventListener('wheel',e=>{camera.position.multiplyScalar(e.deltaY>0?1.08:.92);camera.position.clampLength(2.3,10);},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();
})();
</script>
</body>
</html>
