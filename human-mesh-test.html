<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d13">
<title>Armour of God — Character Workshop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13;color:#f3eee4;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
header{position:fixed;z-index:2;top:0;left:0;right:0;padding:14px 16px;background:linear-gradient(#080d13f0,transparent);pointer-events:none}
@media(max-width:600px){header{padding:10px 12px}.title{font-size:17px;line-height:1.2}.status{font-size:11px;max-width:95%;text-shadow:0 1px 3px #000}#controls{left:6px;right:6px;bottom:42px;gap:6px;padding:6px}#controls button{padding:9px 10px;font-size:12px}#controls label{flex-basis:112px;padding:7px 8px}footer{font-size:10px;padding:7px 8px}}
.eyebrow{font-size:10px;letter-spacing:.2em;color:#e0bd70;font-weight:900}.title{font-size:21px;font-weight:900}.status{font-size:12px;line-height:1.5;color:#c7d0d9;margin-top:5px;max-width:520px}#controls{position:fixed;z-index:3;left:10px;right:10px;bottom:48px;display:flex;flex-direction:row;align-items:stretch;gap:7px;max-width:none;overflow-x:auto;overflow-y:hidden;padding:8px;background:#0b131edb;border:1px solid #394550;border-radius:12px;backdrop-filter:blur(8px)}#controls button{flex:0 0 auto;background:#1c2933;color:#f3eee4;border:1px solid #9c7d43;border-radius:10px;padding:10px 12px;font-weight:700;text-align:left}#controls button:disabled{opacity:.55}#controls label{flex:0 0 125px;display:block;background:#111a22dd;border:1px solid #394550;border-radius:10px;padding:8px 10px;font-size:12px;color:#e6eaf0}#controls input[type=range]{width:100%;accent-color:#d8b56a;margin-top:6px}
footer{position:fixed;z-index:2;bottom:0;left:0;right:0;text-align:center;padding:9px 12px;background:linear-gradient(transparent,#080d13ee);font-size:12px;color:#c7d0d9}
</style>
</head>
<body>
<div id="view"></div><div id="controls"><button id="poseBtn" disabled>Checking animation support…</button><button id="stanceBtn" disabled>Preparing stance controls…</button><button id="resetBtn" disabled>Reset original pose</button><button id="guardBtn" disabled>Guard stance</button><button id="readyBtn" disabled>Ready stance</button><button id="faceBtn" disabled>Face other way</button><label>Skin tone <select id="skinSelect" style="display:block;width:100%;margin-top:6px;background:#111a22;color:#fff;border:1px solid #394550;border-radius:6px;padding:6px"><option value="#3f2116">Deep brown</option><option value="#593322">Dark brown</option><option value="#70432d">Warm brown</option><option value="#925d41">Medium brown</option></select></label><label>Zoom <span id="zoomValue">85%</span><input id="zoomRange" type="range" min="65" max="120" value="85"></label><label>Arm lowering <span id="armValue">40°</span><input id="armRange" type="range" min="10" max="90" value="40" disabled></label><label>Elbow bend <span id="elbowValue">10°</span><input id="elbowRange" type="range" min="0" max="60" value="10" disabled></label><label>Animation <select id="animationSelect" disabled style="display:block;width:100%;margin-top:6px;background:#111a22;color:#fff;border:1px solid #394550;border-radius:6px;padding:6px"><option>Checking model…</option></select></label><label>Playback speed <span id="speedValue">1.0×</span><input id="speedRange" type="range" min="25" max="150" value="100" step="5" disabled></label></div>
<header><div class="eyebrow">ARMOUR OF GOD: THE SOLDIER</div><div class="title">2.5D Character Workshop — Real Human Body / Side View</div><div id="status" class="status">Real 3D human model displayed as a fixed side-view fighter. No camera rotation; experiments stay on this separate workshop page.</div></header>
<footer>2.5D side-view workshop · Real 3D body mesh · Main campaign unchanged</footer>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/loaders/GLTFLoader.js";
(function(){
const status=document.getElementById('status'),host=document.getElementById('view'),stanceBtn=document.getElementById('stanceBtn'),resetBtn=document.getElementById('resetBtn'),armRange=document.getElementById('armRange'),elbowRange=document.getElementById('elbowRange'),armValue=document.getElementById('armValue'),elbowValue=document.getElementById('elbowValue'),guardBtn=document.getElementById('guardBtn'),readyBtn=document.getElementById('readyBtn'),faceBtn=document.getElementById('faceBtn');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080d13);
scene.fog=new THREE.Fog(0x080d13,8,22);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.1,100);camera.position.set(7.0,1.2,0.08);camera.lookAt(0,1.05,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4efff,0x34271d,1.3));
const key=new THREE.DirectionalLight(0xffd7ad,2.0);key.position.set(2,5,4);scene.add(key);
const fill=new THREE.DirectionalLight(0x9bbdff,0.6);fill.position.set(-3,2,-4);scene.add(fill);
const floor=new THREE.Mesh(new THREE.CircleGeometry(4,64),new THREE.MeshStandardMaterial({color:0x17212a,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;scene.add(floor);
const grid=new THREE.GridHelper(8,16,0x57482d,0x29323b);grid.position.y=-.015;scene.add(grid);
let model=null,mixer=null,activeAction=null,stanceApplied=false,stanceBones=[],facingOtherWay=false; const clock=new THREE.Clock(); const poseBtn=document.getElementById('poseBtn'),animationSelect=document.getElementById('animationSelect'),speedRange=document.getElementById('speedRange'),speedValue=document.getElementById('speedValue');
const loader=new GLTFLoader();
const modelURL='https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb';
status.textContent='Preparing the real human body model for a fixed 2.5D side-view fighting stance…';
loader.load(modelURL,function(gltf){
 model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{m.side=THREE.DoubleSide;if(m.color){m.color.set(document.getElementById('skinSelect').value);m.needsUpdate=true}if('roughness' in m)m.roughness=0.82;if('metalness' in m)m.metalness=0.0})}}});
 const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 if(!isFinite(size.y)||size.y===0){status.textContent='The file loaded, but its body dimensions could not be read.';return}
 model.position.sub(center);model.position.y+=size.y/2;model.scale.setScalar(2.25/size.y);scene.add(model);
 camera.position.set(7.0,1.2,0.08);camera.lookAt(0,1.05,0);
 let boneCount=0,skinnedCount=0,boneNames=[],boneMap={};
 model.traverse(o=>{if(o.isSkinnedMesh&&o.skeleton){skinnedCount++;boneCount+=o.skeleton.bones.length;o.skeleton.bones.forEach(b=>{boneMap[b.name.toLowerCase()]=b;if(boneNames.length<12&&!boneNames.includes(b.name))boneNames.push(b.name)})}});
 const clips=gltf.animations||[];
 const sideMatches=(name,side)=>{const n=name.toLowerCase().replace(/[^a-z0-9]+/g,'_');return side==='l'?/(^|_)(left|l)(_|$)/.test(n):/(^|_)(right|r)(_|$)/.test(n);};
 const findSideBone=(parts,side)=>{const wanted=Array.isArray(parts)?parts:[parts];const entries=Object.entries(boneMap);for(const part of wanted){const hit=entries.find(([n])=>n.includes(part)&&sideMatches(n,side));if(hit)return hit[1]}return null;};
 const upperL=findSideBone(['upperarm','upper_arm','arm'], 'l');
 const upperR=findSideBone(['upperarm','upper_arm','arm'], 'r');
 const lowerL=findSideBone(['lowerarm','lower_arm','forearm'], 'l');
 const lowerR=findSideBone(['lowerarm','lower_arm','forearm'], 'r');
 [[upperL,0],[upperR,0],[lowerL,0],[lowerR,0]].forEach(([b])=>{if(b)stanceBones.push({bone:b,original:b.quaternion.clone()})});
 const applyLoweredPose=()=>{const armAngle=Number(armRange.value)*Math.PI/180,elbowAngle=Number(elbowRange.value)*Math.PI/180;stanceBones.forEach(item=>{item.bone.quaternion.copy(item.original);const n=item.bone.name.toLowerCase();const side=sideMatches(n,'l')?'l':'r';const sign=side==='l'?-1:1;const isElbow=/lowerarm|lower_arm|forearm/.test(n);const angle=isElbow?elbowAngle*sign:armAngle*sign;item.bone.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),angle));});model.updateMatrixWorld(true);armValue.textContent=armRange.value+'°';elbowValue.textContent=elbowRange.value+'°';};
 const resetPose=()=>{stanceBones.forEach(item=>item.bone.quaternion.copy(item.original));model.updateMatrixWorld(true);armRange.value=40;elbowRange.value=10;armValue.textContent='40°';elbowValue.textContent='10°';status.textContent='Original T-pose restored. Adjust the sliders to test a different arm angle.';};
 if(upperL&&upperR){
   stanceBtn.disabled=false;resetBtn.disabled=false;armRange.disabled=false;elbowRange.disabled=false;guardBtn.disabled=false;readyBtn.disabled=false;faceBtn.disabled=false;stanceBtn.textContent='Apply current stance';
   stanceBtn.onclick=()=>{applyLoweredPose();status.textContent='Adjustable stance applied. Use the sliders to tune arm lowering and elbow bend; this remains a pose preview, not a finished combat animation.';};
   armRange.addEventListener('input',()=>{if(stanceApplied){applyLoweredPose()}});
   elbowRange.addEventListener('input',()=>{if(stanceApplied){applyLoweredPose()}});
   stanceBtn.onclick=()=>{stanceApplied=true;applyLoweredPose();status.textContent='Adjustable stance applied. Move either slider to refine the pose.';};
   resetBtn.onclick=()=>{stanceApplied=false;resetPose();};
   guardBtn.onclick=()=>{stanceApplied=true;armRange.value=58;elbowRange.value=34;applyLoweredPose();status.textContent='Guard stance preview applied. Tune the arm and elbow sliders for your preferred fighting guard.';};
   readyBtn.onclick=()=>{stanceApplied=true;armRange.value=38;elbowRange.value=18;applyLoweredPose();status.textContent='Ready stance preview applied. This is a starting pose; we will refine shoulder and wrist alignment next.';};
   faceBtn.onclick=()=>{facingOtherWay=!facingOtherWay;model.rotation.y=facingOtherWay?Math.PI:0;faceBtn.textContent=facingOtherWay?'Face original way':'Face other way';status.textContent=facingOtherWay?'Character facing reversed in the fixed side-view camera.':'Character facing returned to the original side-view direction.';};
 }else{stanceBtn.disabled=true;resetBtn.disabled=true;armRange.disabled=true;elbowRange.disabled=true;stanceBtn.textContent='Arm joint names need mapping';}
 const clipNames=clips.length?clips.map(a=>a.name||'(unnamed)').slice(0,5).join(', '):'none bundled';
 if(clips.length){
   mixer=new THREE.AnimationMixer(model);
   animationSelect.innerHTML='';
   clips.forEach((clip,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=clip.name||'Animation '+(index+1);animationSelect.appendChild(option)});
   animationSelect.disabled=false;speedRange.disabled=false;
   const playSelected=()=>{if(activeAction){activeAction.stop();activeAction=null}stanceApplied=false;const chosen=clips[Number(animationSelect.value)]||clips[0];activeAction=mixer.clipAction(chosen);activeAction.reset();activeAction.setEffectiveTimeScale(Number(speedRange.value)/100);activeAction.play();poseBtn.textContent='Stop animation';status.textContent='Playing '+(chosen.name||'selected animation')+'. Change the animation or playback speed using the controls.'};
   poseBtn.disabled=false;poseBtn.textContent='Play selected animation';
   poseBtn.onclick=()=>{if(activeAction){activeAction.stop();activeAction=null;stanceBones.forEach(item=>item.bone.quaternion.copy(item.original));model.updateMatrixWorld(true);poseBtn.textContent='Play selected animation';status.textContent='Animation stopped. The original pose has been restored.';return}playSelected()};
   animationSelect.addEventListener('change',()=>{if(activeAction)playSelected();else status.textContent='Selected animation: '+(clips[Number(animationSelect.value)]?.name||'Animation '+(Number(animationSelect.value)+1))+'. Press Play when ready.'});
   speedRange.addEventListener('input',()=>{const speed=Number(speedRange.value)/100;speedValue.textContent=speed.toFixed(2).replace(/0$/,'')+'×';if(activeAction)activeAction.setEffectiveTimeScale(speed)});
 }else{
   animationSelect.disabled=true;speedRange.disabled=true;poseBtn.disabled=true;poseBtn.textContent='No built-in animation — manual pose controls';
 }
 status.textContent='Real human mesh loaded in fixed 2.5D side view. Rig: '+boneCount+' joints / '+skinnedCount+' skinned mesh(es). Built-in animations: '+clipNames+'. '+(upperL&&upperR?'Both upper-arm joints were found; arm and elbow pose previews are enabled.': 'Arm joints were not fully identified; manual pose sliders remain disabled to avoid damaging the rig.')+' Camera rotation is disabled to preserve the side-view fighter framing.';
},function(xhr){status.textContent=xhr.total>0?'Downloading human mesh… '+Math.round(xhr.loaded/xhr.total*100)+'%':'Waiting for the human model file…';},function(err){console.error(err);status.textContent='The character model could not be loaded. This is an isolated test; the main campaign is unchanged.';});
// Fixed side-view camera for a 2.5D fighting-game presentation; no free rotation.
document.getElementById('skinSelect').addEventListener('change',e=>{if(!model)return;model.traverse(o=>{if(o.isMesh&&o.material){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{if(m.color){m.color.set(e.target.value);m.needsUpdate=true}})}});status.textContent='Skin tone updated on the real human mesh.';});
document.getElementById('zoomRange').addEventListener('input',e=>{const z=Number(e.target.value);const distance=7.0*(85/z);camera.position.set(distance,1.2,.08*(85/z));camera.lookAt(0,1.05,0);document.getElementById('zoomValue').textContent=z+'%';});
document.getElementById('zoomRange').dispatchEvent(new Event('input'));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(mixer)mixer.update(dt);renderer.render(scene,camera)}animate();
})();
</script>
</body>
</html>
