segment(root,[side*.14,1.28,0],[side*.15,.87,0],.105,.085,cloth);ellipsoid(root,side*.15,.86,0,.095,.09,.09,bronze);segment(root,[side*.15,.86,0],[side*.16,.38,.025],.078,.055,skin);ellipsoid(root,side*.16,.61,.015,.082,.12,.075,bronze);ellipsoid(root,side*.16,.36,.055,.065,.055,.07,skin);ellipsoid(root,side*.16,.12,.13,.085,.09,.16,leather)}

function loadFallback(reason){if(model)return;status.textContent='Model could not load ('+reason+'). Showing a visible diagnostic fallback instead.';if(fallbackObject)return;fallbackObject=new THREE.Group();scene.add(fallbackObject);const mat=new THREE.MeshStandardMaterial({color:0xd5ad58,metalness:.45,roughness:.4});const body=new THREE.Mesh(new THREE.BoxGeometry(.65,1.25,.35),mat);body.position.y=1.05;body.castShadow=true;fallbackObject.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,18,12),mat);head.position.y=1.86;head.castShadow=true;fallbackObject.add(head);const limbMat=new THREE.MeshStandardMaterial({color:0x477fd0,wireframe:true});const marker=new THREE.Mesh(new THREE.BoxGeometry(1.25,2.25,.42),limbMat);marker.position.y=1.12;fallbackObject.add(marker);}

}

function setView(yaw){targetYaw=yaw;autoRotate=true;camera.position.set(Math.sin(yaw)*3.2,1.5,Math.cos(yaw)*3.2);camera.lookAt(0,1.05,0)}
