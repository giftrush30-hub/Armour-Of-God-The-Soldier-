<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13;color:#f3eee4;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.top{position:fixed;z-index:3;top:0;left:0;right:0;padding:14px 16px;background:linear-gradient(#080d13ed,transparent);pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.2em;color:#e0bd70;font-weight:900}.title{font-size:22px;font-weight:900}.status{font-size:12px;color:#b9c4d0;margin-top:3px}.note{position:fixed;z-index:3;top:98px;left:14px;right:14px;max-width:520px;font-size:12px;line-height:1.4;color:#d5dce3;pointer-events:none}.bottom{position:fixed;z-index:3;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent,#080d13f2);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btn{background:#1b2631;color:#f8f2e7;border:1px solid #74613c;border-radius:10px;padding:12px 16px;font-weight:800}.fallback{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding-top:55px}.cssman{position:relative;width:230px;height:430px;filter:drop-shadow(0 14px 18px #0009);transform:scale(.9)}.c-head{position:absolute;top:20px;left:85px;width:60px;height:68px;border-radius:46% 46% 43% 43%;background:#98613f;border:2px solid #4e3325}.c-helmet{position:absolute;top:8px;left:77px;width:76px;height:38px;border-radius:50% 50% 12% 12%;background:linear-gradient(90deg,#67421e,#d6ad58,#8c5b25);border:2px solid #e5c87e}.c-crest{position:absolute;top:-12px;left:108px;width:14px;height:26px;background:#d8b45e;clip-path:polygon(50% 0,100% 100%,0 100%)}.eye{position:absolute;top:47px;width:7px;height:5px;background:#15100d;border-radius:50%}.eye.l{left:98px}.eye.r{left:126px}.nose{position:absolute;top:49px;left:113px;width:7px;height:15px;background:#b67d55;clip-path:polygon(50% 0,100% 100%,0 100%)}.beard{position:absolute;top:67px;left:97px;width:37px;height:23px;background:#302019;clip-path:polygon(0 0,100% 0,78% 75%,50% 100%,22% 75%)}.neck{position:absolute;top:81px;left:103px;width:25px;height:27px;background:#98613f}.torso{position:absolute;top:96px;left:62px;width:106px;height:128px;background:linear-gradient(90deg,#253c59,#547eaa 45%,#243b57);clip-path:polygon(24% 0,76% 0,100% 15%,85% 100%,15% 100%,0 15%);border:2px solid #d6ad58}.chestline{position:absolute;top:124px;left:76px;width:78px;height:5px;background:#d6ad58;transform:rotate(-5deg);border-radius:4px}.belt{position:absolute;top:211px;left:65px;width:100px;height:15px;background:#3a261b;border:2px solid #b68a42}.buckle{position:absolute;top:211px;left:107px;width:17px;height:15px;background:#e2bd65;border:2px solid #7b5424}.shoulder{position:absolute;top:101px;width:48px;height:39px;border-radius:45%;background:linear-gradient(#d6ad58,#75481e);border:2px solid #f0d27c}.shoulder.l{left:28px;transform:rotate(-20deg)}.shoulder.r{left:154px;transform:rotate(20deg)}.arm{position:absolute;top:131px;width:28px;height:89px;border-radius:16px;background:linear-gradient(90deg,#76482e,#a8754d,#6b402a);border:2px solid #39291e}.arm.l{left:36px;transform:rotate(8deg)}.arm.r{left:166px;transform:rotate(-8deg)}.bracer{position:absolute;top:172px;width:33px;height:40px;background:linear-gradient(90deg,#593d24,#c29a4d,#72501f);border:2px solid #e0bd70;border-radius:8px}.bracer.l{left:32px;transform:rotate(8deg)}.bracer.r{left:165px;transform:rotate(-8deg)}.hand{position:absolute;top:212px;width:27px;height:31px;border-radius:40% 40% 45% 45%;background:#98613f;border:2px solid #4e3325}.hand.l{left:37px}.hand.r{left:166px}.thigh{position:absolute;top:220px;width:43px;height:94px;border-radius:16px;background:linear-gradient(90deg,#563a23,#b18a49,#63421f);border:2px solid #e0bd70}.thigh.l{left:69px}.thigh.r{left:119px}.shin{position:absolute;top:304px;width:34px;height:82px;border-radius:12px;background:linear-gradient(90deg,#4e3622,#9e7a3f,#54391f);border:2px solid #d0a34c}.shin.l{left:73px}.shin.r{left:123px}.foot{position:absolute;top:377px;width:49px;height:27px;border-radius:9px 15px 7px 7px;background:#38261b;border:2px solid #a17a3d}.foot.l{left:61px}.foot.r{left:119px}@media(min-width:700px){.title{font-size:28px}.note{top:112px;font-size:13px}.cssman{transform:scale(1.05)}}
</style></head>
<body><div id="view"></div>
<div class="fallback" id="fallback"><div class="cssman"><div class="c-crest"></div><div class="c-helmet"></div><div class="c-head"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="beard"></div><div class="neck"></div><div class="shoulder l"></div><div class="shoulder r"></div><div class="torso"></div><div class="chestline"></div><div class="belt"></div><div class="buckle"></div><div class="arm l"></div><div class="arm r"></div><div class="bracer l"></div><div class="bracer r"></div><div class="hand l"></div><div class="hand r"></div><div class="thigh l"></div><div class="thigh r"></div><div class="shin l"></div><div class="shin r"></div><div class="foot l"></div><div class="foot r"></div></div></div>
<div class="top"><div class="eyebrow">ARMOUR OF GOD · STAGE 1</div><div class="title">Warrior Character Lab</div><div class="status" id="status">Building the warrior from built-in shapes…</div></div>
<div class="note">Procedural warrior prototype — no external character model or model loader. Drag to rotate the 3D warrior when the 3D engine is available.</div>
<div class="bottom"><button class="btn" id="front">FRONT</button><button class="btn" id="side">SIDE</button><button class="btn" id="back">BACK</button><button class="btn" id="reset">RESET</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js" onerror="document.getElementById('fallback').style.display='flex';document.getElementById('status').textContent='3D engine blocked; showing built-in warrior illustration.'"></script>
<script>
(function(){
const status=document.getElementById('status'),fallback=document.getElementById('fallback');
function showFallback(msg){fallback.style.display='flex';status.textContent=msg+' Showing built-in warrior illustration instead.'}
if(!window.THREE){showFallback('3D engine did not load.');return}
try{
const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x080d13);
const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(0,1.45,4.2);camera.lookAt(0,1.03,0);
const renderer=new T.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;document.getElementById('view').appendChild(renderer.domElement);
scene.add(new T.AmbientLight(0xffffff,1.2));scene.add(new T.HemisphereLight(0xd7e5ff,0x44301d,.8));const light=new T.DirectionalLight(0xffe4b2,1.5);light.position.set(5,10,5);scene.add(light);const rim=new T.DirectionalLight(0x527fc4,1.4);rim.position.set(-4,4,-4);scene.add(rim);
const floor=new T.Mesh(new T.CircleGeometry(4,48),new T.MeshStandardMaterial({color:0x252b31,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;scene.add(floor);const grid=new T.GridHelper(8,16,0x65563b,0x343b43);grid.position.y=-.025;scene.add(grid);
const root=new T.Group();scene.add(root);
const mat=(color,metalness=0,roughness=.65)=>new T.MeshStandardMaterial({color,metalness,roughness});
const skin=mat(0x98613f,0,.8),skinLight=mat(0xb67d55,0,.78),beard=mat(0x302019,0,.9),armor=mat(0x31547b,.55,.35),bronze=mat(0x8d5c28,.72,.32),gold=mat(0xd9b45e,.8,.25),leather=mat(0x3b271b,.08,.88),dark=mat(0x1b2026,.25,.55),white=mat(0xf0e5d0,0,.35),black=mat(0x100d0b,0,.3);
function mesh(geo,material,parent=root,pos=[0,0,0],scale=null){const m=new T.Mesh(geo,material);m.position.set(...pos);if(scale)m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function ball(pos,scale,material,parent=root){return mesh(new T.SphereGeometry(1,24,18),material,parent,pos,scale)}
function limb(a,b,rA,rB,material,parent=root){const A=new T.Vector3(...a),B=new T.Vector3(...b),d=B.clone().sub(A);const m=mesh(new T.CylinderGeometry(rB,rA,d.length(),16,1),material,parent,A.clone().add(B).multiplyScalar(.5).toArray());m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());return m}
function roundedBox(w,h,d,r,material,pos,parent=root){const g=new T.BoxGeometry(w,h,d,3,4,3);const m=mesh(g,material,parent,pos);return m}
const body=new T.Group();root.add(body);
ball([0,1.47,0],[.245,.34,.155],skin,body);ball([0,1.50,.035],[.26,.24,.17],armor,body);
roundedBox(.45,.045,.035,.02,gold,[0,1.68,.18],body);roundedBox(.045,.19,.025,.01,gold,[0,1.49,.205],body);
ball([-.255,1.62,0],[.15,.12,.145],bronze,body);ball([.255,1.62,0],[.15,.12,.145],bronze,body);
ball([-.255,1.64,.02],[.115,.078,.14],gold,body);ball([.255,1.64,.02],[.115,.078,.14],gold,body);
roundedBox(.34,.13,.20,.02,leather,[0,1.22,0],body);roundedBox(.49,.07,.21,.02,bronze,[0,1.25,.01],body);roundedBox(.075,.075,.035,.01,gold,[0,1.25,.13],body);
limb([0,1.78,0],[0,1.9,0],.075,.075,skin,body);
ball([0,2.00,.005],[.132,.155,.12],skin,body);
ball([-.049,2.025,.105],[.022,.018,.012],white,body);ball([.049,2.025,.105],[.022,.018,.012],white,body);ball([-.049,2.025,.116],[.009,.012,.007],black,body);ball([.049,2.025,.116],[.009,.012,.007],black,body);
ball([0,1.995,.12],[.022,.038,.022],skinLight,body);roundedBox(.085,.018,.018,.005,beard,[0,1.955,.115],body);ball([0,1.927,.105],[.052,.047,.035],beard,body);
ball([0,2.105,0],[.145,.055,.132],bronze,body);ball([0,2.135,-.005],[.04,.07,.04],gold,body);roundedBox(.22,.028,.045,.01,gold,[0,2.065,.11],body);
for(const side of [-1,1]){
// arms are joined directly into the shoulder plates; visible elbows separate upper and lower sections
limb([side*.29,1.62,0],[side*.36,1.37,.015],.095,.075,skin,body);ball([side*.36,1.37,.015],[.075,.075,.075],bronze,body);
limb([side*.36,1.37,.015],[side*.39,1.13,.04],.068,.052,skin,body);ball([side*.39,1.10,.06],[.06,.075,.045],skin,body);
limb([side*.13,1.20,0],[side*.14,.87,0],.105,.082,skin,body);ball([side*.14,.86,.01],[.09,.08,.085],bronze,body);
limb([side*.14,.86,.01],[side*.15,.49,.02],.078,.06,skin,body);ball([side*.15,.64,.025],[.084,.12,.075],bronze,body);
limb([side*.15,.49,.02],[side*.15,.18,.04],.065,.052,skin,body);ball([side*.15,.35,.03],[.072,.10,.07],bronze,body);
ball([side*.15,.09,.09],[.09,.065,.15],leather,body);
}
// Add chest plate edging and a central raised emblem
roundedBox(.055,.22,.026,.01,gold,[0,1.49,.222],body);ball([0,1.56,.242],[.055,.07,.018],gold,body);
// Slightly muscular chest overlays, attached directly to the torso
ball([-.105,1.57,.18],[.14,.115,.06],armor,body);ball([.105,1.57,.18],[.14,.115,.06],armor,body);
let yaw=0,auto=true,lastX=0,drag=false;const clock=new T.Clock();
function view(a){yaw=a;auto=false;camera.position.set(Math.sin(a)*4.2,1.45,Math.cos(a)*4.2);camera.lookAt(0,1.03,0)}
document.getElementById('front').onclick=()=>view(0);document.getElementById('side').onclick=()=>view(Math.PI/2);document.getElementById('back').onclick=()=>view(Math.PI);document.getElementById('reset').onclick=()=>{yaw=0;auto=true;camera.position.set(0,1.45,4.2);camera.lookAt(0,1.03,0)};
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){auto=false;yaw+=(e.clientX-lastX)*.008;lastX=e.clientX;root.rotation.y=yaw}});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
status.textContent='Procedural 3D warrior ready · no character files or model loader';
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();if(auto){yaw=t*.18;root.rotation.y=yaw}body.scale.y=1+.008*Math.sin(t*2.2);body.rotation.z=.012*Math.sin(t*1.1);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){console.error(e);showFallback('3D rendering unavailable.')}
})();
</script>
</body></html>
