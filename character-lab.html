<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d13"><title>Armour of God — Character Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13;color:#f3eee4;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.top{position:fixed;z-index:2;top:0;left:0;right:0;padding:15px 16px;background:linear-gradient(#080d13f0,transparent)}.eyebrow{font-size:10px;letter-spacing:.2em;color:#e0bd70;font-weight:900}.title{font-size:22px;font-weight:900}.status{font-size:12px;color:#b9c4d0;margin-top:3px}.bottom{position:fixed;z-index:2;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent,#080d13f2);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btn{background:#1b2631;color:#f8f2e7;border:1px solid #74613c;border-radius:10px;padding:12px 16px;font-weight:800}.note{position:fixed;top:112px;left:14px;right:14px;z-index:2;font-size:12px;line-height:1.45;color:#d5dce3;max-width:540px}.tag{color:#e3c476;font-weight:800}@media(min-width:700px){.title{font-size:28px}.note{top:126px;font-size:13px}}
</style></head><body><div id="view"></div><div class="top"><div class="eyebrow">ARMOUR OF GOD · STAGE 1</div><div class="title">Warrior Character Lab</div><div class="status" id="status">Preparing model viewer…</div></div><div class="note">First, we're checking a <span class="tag">real rigged humanoid model</span> instead of building the whole body from floating shapes. Drag to rotate the view. This is a model test, not the finished biblical warrior.</div><div class="bottom"><button class="btn" id="front">FRONT VIEW</button><button class="btn" id="side">SIDE VIEW</button><button class="btn" id="back">BACK VIEW</button><button class="btn" id="reset">RESET</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const status=document.getElementById('status');
if(!window.THREE){status.textContent='3D engine did not load. Open in Chrome and reload.';return}
if(!THREE.GLTFLoader){status.textContent='Model loader did not load. Please reload once.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080d13);scene.fog=new THREE.Fog(0x080d13,18,40);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,2.5,7.5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;document.getElementById('view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc8d9ff,0x362a1b,2));
const key=new THREE.DirectionalLight(0xffe4b2,3);key.position.set(4,8,5);key.castShadow=true;scene.add(key);
const rim=new THREE.DirectionalLight(0x477fd0,2.2);rim.position.set(-5,4,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(4.8,4.8,.25,64),new THREE.MeshStandardMaterial({color:0x30363d,roughness:.9,metalness:.08}));floor.position.y=-.14;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(3.6,.035,8,80),new THREE.MeshStandardMaterial({color:0xc5a45d,metalness:.65,roughness:.4}));ring.rotation.x=Math.PI/2;ring.position.y=.005;scene.add(ring);
const grid=new THREE.GridHelper(9,18,0x55504a,0x353b42);grid.position.y=.005;scene.add(grid);
let model=null,mixer=null,clips=[],clock=new THREE.Clock(),targetYaw=0,dragging=false,lastX=0;
const loader=new THREE.GLTFLoader();status.textContent='Loading rigged humanoid model…';
loader.load('https://threejs.org/examples/models/gltf/Soldier.glb',g=>{
model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());model.position.x=-center.x;model.position.z=-center.z;model.position.y=-box.min.y;const h=size.y||1;model.scale.setScalar(2.65/h);model.position.y=0;
if(g.animations&&g.animations.length){mixer=new THREE.AnimationMixer(model);clips=g.animations;const idle=clips.find(c=>/idle/i.test(c.name))||clips[0];if(idle)mixer.clipAction(idle).play()}
status.textContent='Rigged humanoid loaded · '+(clips.length?clips.length+' animation clips':'no animation clips')+' · inspect body proportions';
},undefined,e=>{console.error(e);status.textContent='Model download failed. The page is alive, but the external model could not load on this network.'});
const ground=new THREE.Mesh(new THREE.CircleGeometry(1.1,48),new THREE.MeshStandardMaterial({color:0x171b20,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=.012;scene.add(ground);
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);if(model)model.rotation.y+= (targetYaw-model.rotation.y)*.12;renderer.render(scene,camera)}animate();
function setView(yaw){targetYaw=yaw;camera.position.set(Math.sin(yaw)*7.5,2.35,Math.cos(yaw)*7.5);camera.lookAt(0,1.25,0)}
document.getElementById('front').onclick=()=>setView(0);document.getElementById('side').onclick=()=>setView(Math.PI/2);document.getElementById('back').onclick=()=>setView(Math.PI);
document.getElementById('reset').onclick=()=>{targetYaw=0;camera.position.set(0,2.5,7.5);camera.lookAt(0,1.25,0)};
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(dragging){targetYaw+=(e.clientX-lastX)*.008;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
